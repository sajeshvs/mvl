# =============================================================================
# CALCULATED COLUMNS (if needed)
# =============================================================================

calculated_columns:
  
  - name: QuotationYear
    table: Quotations
    column: Year
    dax: |
      Year = YEAR('Quotations'[CreatedDate])
    
  - name: QuotationMonth
    table: Quotations
    column: Month
    dax: |
      Month = FORMAT('Quotations'[CreatedDate], "YYYY-MM")
    
  - name: POYear
    table: PurchaseOrders
    column: Year
    dax: |
      Year = YEAR('PurchaseOrders'[PODate])
    
  - name: POMonth
    table: PurchaseOrders
    column: Month
    dax: |
      Month = FORMAT('PurchaseOrders'[PODate], "YYYY-MM")

# =============================================================================
# CALCULATION GROUPS (Advanced)
# =============================================================================

calculation_groups:
  
  - name: TimeIntelligence
    table: TimeCalc
    items:
      - name: Current
        ordinal: 0
        format: ""
        expression: "SELECTEDMEASURE()"
      
      - name: MTD
        ordinal: 1
        format: ""
        expression: "TOTALMTD(SELECTEDMEASURE(), 'Calendar'[Date])"
      
      - name: YTD
        ordinal: 2
        format: ""
        expression: "TOTALYTD(SELECTEDMEASURE(), 'Calendar'[Date])"
      
      - name: PY
        ordinal: 3
        format: ""
        expression: "CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR('Calendar'[Date]))"
      
      - name: YoY%
        ordinal: 4
        format: "0.0%"
        expression: |
          VAR Current = SELECTEDMEASURE()
          VAR PY = CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR('Calendar'[Date]))
          RETURN DIVIDE(Current - PY, PY, 0)
